<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд | Админка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin">Админ-панель</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/admin/products">Товары</a>
            <a class="nav-link" href="/admin/users">Пользователи</a>
            <a class="nav-link" href="/admin/orders">Заказы</a>
            <a class="nav-link" href="/auth/logout">Выйти</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 class="mb-4">Дашборд</h1>

    <!-- Карточки со статистикой -->
    <div class="row mb-4">
        <div class="col-md-4 mb-3">
            <div class="card text-white bg-primary">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title text-uppercase">Товары</h6>
                            <h2 class="mb-0" th:text="${productsCount}">0</h2>
                        </div>
                        <i class="bi bi-box fs-1"></i>
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <span>В каталоге</span>
                    <a href="/admin/products" class="text-white text-decoration-none">
                        Управление <i class="bi bi-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card text-white bg-success">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title text-uppercase">Пользователи</h6>
                            <h2 class="mb-0" th:text="${usersCount}">0</h2>
                        </div>
                        <i class="bi bi-people fs-1"></i>
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <span>Зарегистрировано</span>
                    <a href="/admin/users" class="text-white text-decoration-none">
                        Управление <i class="bi bi-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card text-white bg-warning">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title text-uppercase">Заказы</h6>
                            <h2 class="mb-0" th:text="${ordersCount}">0</h2>
                        </div>
                        <i class="bi bi-cart fs-1"></i>
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <span>Всего заказов</span>
                    <a href="/admin/orders" class="text-white text-decoration-none">
                        Управление <i class="bi bi-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Быстрые действия -->
    <div class="row">
        <div class="col-md-6 mb-3">
            <div class="card">
                <div class="card-header">
                    <h5>Быстрые действия</h5>
                </div>
                <div class="card-body">
                    <div class="d-grid gap-2">
                        <a href="/admin/products/new" class="btn btn-outline-primary">
                            <i class="bi bi-plus-circle"></i> Добавить товар
                        </a>
                        <a href="/admin/orders" class="btn btn-outline-secondary">
                            <i class="bi bi-list-check"></i> Просмотреть заказы
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card">
                <div class="card-header">
                    <h5>Навигация</h5>
                </div>
                <div class="card-body">
                    <div class="list-group">
                        <a href="/products" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                            Перейти в магазин
                            <i class="bi bi-shop"></i>
                        </a>
                        <a href="/cart" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                            Корзина
                            <i class="bi bi-cart"></i>
                        </a>
                        <a href="/auth/logout" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center text-danger">
                            Выйти из системы
                            <i class="bi bi-box-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
