<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Управление товарами | Админка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin">Админ-панель</a>
        <div class="navbar-nav">
            <a class="nav-link active" href="/admin/products">Товары</a>
            <a class="nav-link" href="/admin/users">Пользователи</a>
            <a class="nav-link" href="/admin/orders">Заказы</a>
            <a class="nav-link" href="/auth/logout">Выйти</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Товары</h1>
        <a href="/admin/products/new" class="btn btn-primary">+ Добавить товар</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Цена</th>
            <th>Количество</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}">1</td>
            <td th:text="${product.name}">Товар</td>
            <td th:text="${product.price} + ' ₽'">0</td>
            <td th:text="${product.quantity}">0</td>
            <td>
                <a th:href="@{/admin/products/{id}/edit(id=${product.id})}"
                   class="btn btn-sm btn-outline-primary">Изменить</a>
                <form th:action="@{/admin/products/{id}/delete(id=${product.id})}"
                      method="post" class="d-inline"
                      th:onsubmit="return confirm('Удалить товар?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
