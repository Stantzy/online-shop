<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit ? 'Редактировать' : 'Новый'} + ' товар | Админка'">Форма товара</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin">Админ-панель</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/admin/products">Товары</a>
            <a class="nav-link" href="/admin/users">Пользователи</a>
            <a class="nav-link" href="/admin/orders">Заказы</a>
            <a class="nav-link" href="/auth/logout">Выйти</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 th:text="${isEdit ? 'Редактировать товар' : 'Новый товар'}">Форма</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{${isEdit ? '/admin/products/' + product.id : '/admin/products'}}"
                          method="post" th:object="${product}">

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" th:if="${isEdit}" th:field="*{id}">

                        <div class="mb-3">
                            <label for="name" class="form-label">Название</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required>
                        </div>

                        <div class="mb-3">
                            <label for="price" class="form-label">Цена (₽)</label>
                            <input type="number" step="0.01" class="form-control" id="price"
                                   th:field="*{price}" required>
                        </div>

                        <div class="mb-3">
                            <label for="quantity" class="form-label">Количество на складе</label>
                            <input type="number" class="form-control" id="quantity"
                                   th:field="*{quantity}" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                            <a href="/admin/products" class="btn btn-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
