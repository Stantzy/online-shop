<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи | Админка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin">Админ-панель</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/admin/products">Товары</a>
            <a class="nav-link active" href="/admin/users">Пользователи</a>
            <a class="nav-link" href="/admin/orders">Заказы</a>
            <a class="nav-link" href="/auth/logout">Выйти</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Пользователи</h1>
    </div>

    <!-- Flash-сообщения -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Таблица пользователей -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Имя пользователя</th>
                <th>Email</th>
                <th>Роль</th>
                <th>Дата регистрации</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.username}">username</td>
                <td th:text="${user.email}">email@example.com</td>
                <td>
                        <span th:classappend="${user.role == 'ADMIN'} ? 'bg-danger' : 'bg-primary'"
                              class="badge" th:text="${user.role}">USER</span>
                </td>
                <td th:text="${user.registrationDate}">2024-01-01</td>
                <td>
                    <div class="btn-group" role="group">
                        <a th:href="@{/admin/users/{id}(id=${user.id})}"
                           class="btn btn-sm btn-outline-primary">Просмотр</a>

                        <form th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                              method="post" class="d-inline"
                              th:onsubmit="return confirm('Удалить пользователя? Все заказы пользователя также будут удалены.')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Сообщение если нет пользователей -->
    <div th:if="${users == null || users.isEmpty()}" class="alert alert-info">
        Нет зарегистрированных пользователей.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
