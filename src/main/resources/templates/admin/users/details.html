<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Пользователь: ' + ${user.username} + ' | Админка'">Детали пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin">Админ-панель</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/admin/products">Товары</a>
            <a class="nav-link active" href="/admin/users">Пользователи</a>
            <a class="nav-link" href="/admin/orders">Заказы</a>
            <a class="nav-link" href="/auth/logout">Выйти</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/admin">Админка</a></li>
            <li class="breadcrumb-item"><a href="/admin/users">Пользователи</a></li>
            <li class="breadcrumb-item active" th:text="${user.username}">username</li>
        </ol>
    </nav>

    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3>Информация о пользователе</h3>
                </div>
                <div class="card-body">
                    <table class="table table-borderless">
                        <tr>
                            <th style="width: 150px;">ID:</th>
                            <td th:text="${user.id}">1</td>
                        </tr>
                        <tr>
                            <th>Имя пользователя:</th>
                            <td th:text="${user.username}">username</td>
                        </tr>
                        <tr>
                            <th>Email:</th>
                            <td th:text="${user.email}">email@example.com</td>
                        </tr>
                        <tr>
                            <th>Роль:</th>
                            <td>
                                <span th:classappend="${user.role == 'ADMIN'} ? 'bg-danger' : 'bg-primary'"
                                      class="badge" th:text="${user.role}">USER</span>
                            </td>
                        </tr>
                        <tr>
                            <th>Дата регистрации:</th>
                            <td th:text="${user.registrationDate}">2024-01-01</td>
                        </tr>
                    </table>
                </div>
                <div class="card-footer">
                    <div class="d-flex gap-2">
                        <a href="/admin/users" class="btn btn-secondary">Назад к списку</a>

                        <form th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                              method="post" class="d-inline"
                              th:onsubmit="return confirm('Удалить пользователя? Все его заказы также будут удалены.')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-danger">Удалить пользователя</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h5>Статистика</h5>
                </div>
                <div class="card-body">
                    <p><strong>Заказов:</strong>
                        <span th:text="${ordersCount != null ? ordersCount : '—'}">0</span>
                    </p>
                    <p><strong>Сумма покупок:</strong>
                        <span th:text="${totalSpent != null ? totalSpent + ' ₽' : '—'}">0 ₽</span>
                    </p>

                    <a th:href="@{/admin/users/{id}/orders(id=${user.id})}"
                       class="btn btn-outline-primary btn-sm mt-2">
                        Посмотреть заказы
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
