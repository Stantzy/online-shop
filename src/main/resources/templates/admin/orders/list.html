<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление заказами | Админка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin">Админ-панель</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/admin/products">Товары</a>
            <a class="nav-link" href="/admin/users">Пользователи</a>
            <a class="nav-link active" href="/admin/orders">Заказы</a>
            <a class="nav-link" href="/auth/logout">Выйти</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Все заказы</h1>
    </div>

    <!-- Фильтр по статусу -->
    <div class="mb-3">
        <div class="btn-group">
            <a href="/admin/orders" class="btn btn-outline-secondary" th:classappend="${status == null} ? 'active'">Все</a>
            <a href="/admin/orders?status=CART" class="btn btn-outline-secondary" th:classappend="${status == 'CART'} ? 'active'">Корзины</a>
            <a href="/admin/orders?status=CREATED" class="btn btn-outline-info" th:classappend="${status == 'CREATED'} ? 'active'">Созданные</a>
            <a href="/admin/orders?status=APPROVED" class="btn btn-outline-success" th:classappend="${status == 'APPROVED'} ? 'active'">Подтверждённые</a>
            <a href="/admin/orders?status=CANCELLED" class="btn btn-outline-danger" th:classappend="${status == 'CANCELLED'} ? 'active'">Отменённые</a>
        </div>
    </div>

    <!-- Flash-сообщения -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Таблица заказов -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID заказа</th>
                <th>ID пользователя</th>
                <th>Статус</th>
                <th>Кол-во позиций</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.orderId}">1</td>
                <td>
                    <a th:href="@{/admin/users/{id}(id=${order.userId})}" th:text="${order.userId}">
                        1
                    </a>
                </td>
                <td>
                    <span th:classappend="${order.orderStatus == 'APPROVED'} ? 'bg-success' :
                                          (${order.orderStatus == 'CANCELLED'} ? 'bg-danger' :
                                           (${order.orderStatus == 'CREATED'} ? 'bg-info' : 'bg-secondary'))"
                          class="badge" th:text="${order.orderStatus}">STATUS</span>
                </td>
                <td th:text="${#lists.size(order.orderLineIds)}">0</td>
                <td>
                    <div class="btn-group" role="group">
                        <a th:href="@{/admin/orders/{id}(id=${order.orderId})}"
                           class="btn btn-sm btn-outline-primary">Просмотр</a>

                        <!-- Смена статуса (только для не-корзин) -->
                        <div class="btn-group" role="group" th:unless="${order.orderStatus == 'CART'}">
                            <button class="btn btn-sm btn-outline-secondary dropdown-toggle"
                                    data-bs-toggle="dropdown">
                                Статус
                            </button>
                            <ul class="dropdown-menu">
                                <li>
                                    <form th:action="@{/admin/orders/{id}/status(id=${order.orderId})}" method="post">
                                        <input type="hidden" name="status" value="CREATED">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="dropdown-item">Создан</button>
                                    </form>
                                </li>
                                <li>
                                    <form th:action="@{/admin/orders/{id}/status(id=${order.orderId})}" method="post">
                                        <input type="hidden" name="status" value="APPROVED">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="dropdown-item">Подтверждён</button>
                                    </form>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form th:action="@{/admin/orders/{id}/status(id=${order.orderId})}" method="post">
                                        <input type="hidden" name="status" value="CANCELLED">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="dropdown-item text-danger">Отменён</button>
                                    </form>
                                </li>
                            </ul>
                        </div>

                        <form th:action="@{/admin/orders/{id}/delete(id=${order.orderId})}"
                              method="post" class="d-inline"
                              th:onsubmit="return confirm('Удалить заказ #' + ${order.orderId} + '?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${orders == null || orders.isEmpty()}" class="alert alert-info">
        Заказов не найдено.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
