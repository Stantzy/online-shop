<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' | OnlineShop'">Товар</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="/products">OnlineShop</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/cart">Корзина</a>
            <a class="nav-link" href="/orders">Заказы</a>

            <th:block sec:authorize="isAuthenticated()">
                <span class="navbar-text me-2">
                    <span sec:authentication="name"></span>
                </span>
                <a class="nav-link" href="/auth/logout">Выйти</a>
            </th:block>

            <th:block sec:authorize="!isAuthenticated()">
                <a class="nav-link" href="/auth/login">Войти</a>
            </th:block>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/products">Каталог</a></li>
            <li class="breadcrumb-item active" th:text="${product.name}">Товар</li>
        </ol>
    </nav>

    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h1 th:text="${product.name}">Название товара</h1>
                    <h3 class="text-primary mb-3" th:text="${product.price} + ' ₽'">Цена</h3>

                    <p>
                        <strong>Артикул:</strong> <span th:text="${product.id}">ID</span>
                    </p>

                    <p>
                        <strong>Наличие:</strong>
                        <span th:if="${product.quantity > 0}" class="text-success">
                            В наличии (<span th:text="${product.quantity}"></span> шт.)
                        </span>
                        <span th:unless="${product.quantity > 0}" class="text-danger">
                            Нет в наличии
                        </span>
                    </p>

                    <form th:action="@{/cart/add}" method="post" class="mt-4">
                        <input type="hidden" name="productId" th:value="${product.id}">

                        <div class="mb-3">
                            <label for="quantity" class="form-label">Количество:</label>
                            <input type="number" class="form-control" id="quantity"
                                   name="quantity" value="1" min="1"
                                   th:max="${product.quantity}" style="width: 100px;">
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg"
                                th:disabled="${product.quantity == 0}">
                            Добавить в корзину
                        </button>

                        <a href="/products" class="btn btn-outline-secondary btn-lg">
                            Вернуться в каталог
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
