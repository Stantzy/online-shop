<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои заказы | OnlineShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="/products">OnlineShop</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/cart">Корзина</a>
            <a class="nav-link" href="/orders">Заказы</a>

            <th:block sec:authorize="isAuthenticated()">
                <span class="navbar-text me-2">
                    <span sec:authentication="name"></span>
                </span>
                <a class="nav-link" href="/auth/logout">Выйти</a>
            </th:block>

            <th:block sec:authorize="!isAuthenticated()">
                <a class="nav-link" href="/auth/login">Войти</a>
            </th:block>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1>Мои заказы</h1>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <div th:if="${orders == null || orders.isEmpty()}">
        <p>У вас пока нет заказов.</p>
        <a href="/products" class="btn btn-primary">Перейти в каталог</a>
    </div>

    <div th:unless="${orders == null || orders.isEmpty()}">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>Номер заказа</th>
                <th>Статус</th>
                <th>Количество позиций</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.orderId}">#12345</td>
                <td>
                        <span th:class="'badge ' + (${order.orderStatus.name() == 'PAID' or order.orderStatus.name() == 'COMPLETED'} ? 'bg-success' : 'bg-warning')"
                              th:text="${order.orderStatus}">Статус</span>
                </td>
                <td th:text="${#lists.size(order.orderLineIds)}">0</td>
                <td>
                    <a th:href="@{/orders/{id}(id=${order.orderId})}"
                       class="btn btn-sm btn-outline-primary">Подробнее</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
