<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Заказ #' + ${order.orderId} + ' | OnlineShop'">Заказ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="/products">OnlineShop</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/cart">Корзина</a>
            <a class="nav-link" href="/orders">Заказы</a>

            <th:block sec:authorize="isAuthenticated()">
                <span class="navbar-text me-2">
                    <span sec:authentication="name"></span>
                </span>
                <a class="nav-link" href="/auth/logout">Выйти</a>
            </th:block>

            <th:block sec:authorize="!isAuthenticated()">
                <a class="nav-link" href="/auth/login">Войти</a>
            </th:block>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/products">Каталог</a></li>
            <li class="breadcrumb-item"><a href="/orders">Заказы</a></li>
            <li class="breadcrumb-item active" th:text="'Заказ #' + ${order.orderId}">Заказ</li>
        </ol>
    </nav>

    <div class="card">
        <div class="card-header">
            <h2 th:text="'Заказ #' + ${order.orderId}">Заказ #12345</h2>
        </div>
        <div class="card-body">
            <p>
                <strong>Статус:</strong>
                <span th:class="'badge ' + (${order.orderStatus.name() == 'PAID' or order.orderStatus.name() == 'COMPLETED'} ? 'bg-success' : 'bg-warning')"
                      th:text="${order.orderStatus}">Статус</span>
            </p>
            <p><strong>ID пользователя:</strong> <span th:text="${order.userId}">User ID</span></p>

            <h4 class="mt-4">Состав заказа</h4>
            <ul class="list-group">
                <li class="list-group-item" th:each="lineId : ${order.orderLineIds}">
                    Позиция ID: <span th:text="${lineId}">Line ID</span>
                </li>
            </ul>
        </div>
        <div class="card-footer">
            <a href="/orders" class="btn btn-secondary">Назад к списку заказов</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
